    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...DEFAULT_DATA, ...parsed };
        }
      } catch (e) {
        console.error('Error load localStorage:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveDatabaseLocally() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (e) {
        console.error('Error save localStorage:', e);
      }
    }

    // Sinkronisasi otomatis ke Google Apps Script (jika dijalankan di Apps Script)
    function syncToGoogleSheets(silent = false) {
      saveDatabaseLocally();
      if (isGasEnvironment) {
        if (!silent) showToast('Menyinkronkan ke Google Spreadsheet...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (!silent) showToast(res.message || 'Data tersimpan ke Spreadsheet!', 'success');
            syncStatusText = 'Tersinkronisasi Spreadsheet: ' + new Date().toLocaleTimeString('id-ID');
            renderHeaderStatus();
          })
          .withFailureHandler(function(err) {
            if (!silent) showToast('Gagal sinkron: ' + err.message, 'error');
            syncStatusText = 'Gagal sinkronisasi';
            renderHeaderStatus();
          })
          .apiSaveDatabase(JSON.stringify(db));
      } else {
        if (!silent) showToast('Data berhasil disimpan secara lokal!', 'success');
      }
    }

    function pullFromGoogleSheets() {
      if (isGasEnvironment) {
        showToast('Mengambil data terbaru dari Spreadsheet...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success' && res.data) {
              db = { ...db, ...res.data };
              saveDatabaseLocally();
              showToast('Data berhasil diperbarui dari Google Spreadsheet!', 'success');
              render();
            }
          })
          .withFailureHandler(function(err) {
            showToast('Gagal mengambil data: ' + err.message, 'error');
          })
          .apiGetDatabase();
      } else {
        showToast('Berjalan di browser biasa (Standalone Mode)', 'info');
      }
    }

    // Inisialisasi awal tarik data dari GAS jika ada
    if (isGasEnvironment) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success' && res.data && res.data.profil) {
            db = { ...db, ...res.data };
            saveDatabaseLocally();
            render();
          }
        })
        .apiGetDatabase();
    }

    // ==========================================
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      const toastContent = document.getElementById('toastContent');

      toastMsg.innerText = msg;
      if (type === 'success') {
        toastIcon.innerHTML = '✓';
        toastContent.className = 'bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-emerald-500';
      } else if (type === 'error') {
        toastIcon.innerHTML = '✕';
        toastContent.className = 'bg-rose-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-rose-500';
      } else {
        toastIcon.innerHTML = 'ℹ';
        toastContent.className = 'bg-blue-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-blue-500';
      }

      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    function renderHeaderStatus() {
      const el = document.getElementById('cloudStatusBadge');
      if (el) el.innerText = syncStatusText;

    // ==========================================
    // 4. AUTENTIKASI (LOGIN & LOGOUT)
    // ==========================================
    function login(username, password) {
      const user = db.users.find(u => u.username === username && u.password === password);
      if (user) {
        currentUser = user;
        activeTab = user.role === 'admin' ? 'dashboard' : 'guru_dashboard';
        showToast(`Selamat datang, ${user.fullName}!`, 'success');
        render();
      } else {
        showToast('Username atau password salah! (Coba admin/123 atau budi/123)', 'error');
      }
    }

    function logout() {
      currentUser = null;
      activeTab = 'login';
      showToast('Anda telah keluar dari aplikasi.', 'info');
      render();
    }

    // ==========================================
    // 5. HELPER KALKULASI NILAI KURIKULUM MERDEKA
    // ==========================================
    function calculateNilai(s1, s2, s3, sts, sas, kktp = 75) {
      const valsSisipan = [s1, s2, sts].filter(v => v !== null && v !== undefined && v !== '');
      const nilaiSisipan = valsSisipan.length > 0
        ? Math.round(valsSisipan.reduce((a, b) => Number(a) + Number(b), 0) / valsSisipan.length)
        : 0;

      const valsAkhir = [s1, s2, s3, sts, sas].filter(v => v !== null && v !== undefined && v !== '');
      const nilaiAkhir = valsAkhir.length > 0
        ? Math.round(valsAkhir.reduce((a, b) => Number(a) + Number(b), 0) / valsAkhir.length)
        : 0;

      let capaianSisipan = '';
      if (nilaiSisipan >= 90) capaianSisipan = 'Menunjukkan penguasaan sangat istimewa pada tujuan pembelajaran yang diujikan.';
      else if (nilaiSisipan >= kktp) capaianSisipan = 'Menunjukkan penguasaan yang baik dan telah mencapai kriteria ketuntasan (KKTP).';
      else capaianSisipan = 'Perlu bimbingan dan penguatan secara terstruktur pada materi pembelajaran.';

      let capaianAkhir = '';
      if (nilaiAkhir >= 90) capaianAkhir = 'Sangat baik dan konsisten dalam menganalisis serta menyelesaikan persoalan materi secara mandiri.';
      else if (nilaiAkhir >= kktp) capaianAkhir = 'Mencapai kriteria ketuntasan minimum dengan pemahaman yang baik pada seluruh capaian pembelajaran.';
      else capaianAkhir = 'Perlu pendampingan remedial dan pengulangan konsep dasar kompetensi.';

      return { nilaiSisipan, capaianSisipan, nilaiAkhir, capaianAkhir };
    }

    function updateRowNilai(siswaId) {
      const s1 = document.getElementById(`s1_${siswaId}`).value;
      const s2 = document.getElementById(`s2_${siswaId}`).value;
      const s3 = document.getElementById(`s3_${siswaId}`).value;
      const sts = document.getElementById(`sts_${siswaId}`).value;
      const sas = document.getElementById(`sas_${siswaId}`).value;

      const calc = calculateNilai(s1, s2, s3, sts, sas);
      document.getElementById(`sisipan_${siswaId}`).innerText = calc.nilaiSisipan;
      document.getElementById(`akhir_${siswaId}`).innerText = calc.nilaiAkhir;
      document.getElementById(`capaian_${siswaId}`).innerText = calc.capaianAkhir;

      let record = db.penilaian.find(p => p.siswaId === siswaId && p.mapel === filterMapel);
      if (record) {
        record.sumatif1 = s1 ? Number(s1) : '';
        record.sumatif2 = s2 ? Number(s2) : '';
        record.sumatif3 = s3 ? Number(s3) : '';
        record.sts = sts ? Number(sts) : '';
        record.sas = sas ? Number(sas) : '';
        record.nilaiSisipan = calc.nilaiSisipan;
        record.capaianSisipan = calc.capaianSisipan;
        record.nilaiAkhir = calc.nilaiAkhir;
        record.capaianAkhir = calc.capaianAkhir;
      }
    }

    function updateAbsenStatus(siswaId, status) {

      const siswa = db.siswa.find(s => s.id === siswaId);
      if (rec) {
        rec.status = status;
      } else {
        db.absensi.push({
          id: 'ABS-' + Date.now() + '-' + siswaId,
          tanggal: today,
          kelas: filterKelas,
          rombel: filterRombel,
          siswaId: siswaId,
          namaSiswa: siswa ? siswa.nama : '',
          status: status,
          keterangan: '',
          waliKelas: currentUser.fullName
        });
      }
    }

    function updateAbsenKet(siswaId, ket) {
      const today = new Date().toISOString().split('T')[0];
      let rec = db.absensi.find(a => a.siswaId === siswaId && a.tanggal === today);
      if (rec) rec.keterangan = ket;
    }

    function setSemuaHadir() {
      const siswaList = db.siswa.filter(s => s.kelas === filterKelas && s.rombel === filterRombel);
      const today = new Date().toISOString().split('T')[0];
      siswaList.forEach(s => {
        let rec = db.absensi.find(a => a.siswaId === s.id && a.tanggal === today);
        if (rec) {
          rec.status = 'H';
        } else {
          db.absensi.push({
            id: 'ABS-' + Date.now() + '-' + s.id,
            tanggal: today,
            kelas: filterKelas,
            rombel: filterRombel,
            siswaId: s.id,
            namaSiswa: s.nama,
            status: 'H',
            keterangan: '',

                    <div class="font-bold text-slate-800">Wali Kelas ${filterKelas}${filterRombel}</div>
                    <div class="text-[10px] text-blue-700 font-semibold uppercase">Tanda Tangan Elektronik (TTE)</div>
                  </div>
                  <div class="my-1 flex flex-col items-center">
                    <canvas id="qrWaliAbsen" class="w-16 h-16 shadow-xs border border-slate-200 rounded"></canvas>
                    <span class="text-[9px] text-slate-400 mt-0.5 font-mono">TTE-WK-${filterKelas}${filterRombel}</span>
                  </div>
                  <div>
                    <div class="font-extrabold text-slate-900 border-b border-slate-800 pb-0.5 text-xs">${wali.namaGuru}</div>
                    <div class="text-[10px] text-slate-600">NUPTK: ${wali.nikNuptk}</div>
                  </div>
                </div>

                <!-- Kepala Sekolah -->
                <div class="flex flex-col items-center justify-between h-48 border-2 border-indigo-200 p-3 rounded-xl bg-indigo-50/30">
                  <div>
                    <div class="font-bold text-slate-800">Kepala Sekolah</div>
                    <div class="text-[10px] text-indigo-700 font-semibold uppercase">Tanda Tangan Elektronik (TTE)</div>
                  </div>
                  <div class="my-1 flex flex-col items-center">
                    <canvas id="qrKsAbsen" class="w-16 h-16 shadow-xs border border-slate-200 rounded"></canvas>
                    <span class="text-[9px] text-slate-400 mt-0.5 font-mono">TTE-KS-${db.profil.npsn}</span>
                  </div>
                  <div>
                    <div class="font-extrabold text-slate-900 border-b border-slate-800 pb-0.5 text-xs">${db.profil.kepalaSekolah}</div>
                    <div class="text-[10px] text-slate-600">NIP/NUPTK: ${db.profil.nuptk}</div>
                  </div>
                </div>
              </div>

              <div class="mt-8 pt-3 border-t border-slate-200 text-[9px] text-slate-400 text-center">
                Dokumen presensi ini disahkan dan divalidasi secara digital melalui Google Spreadsheet Backend SiApgus.
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function generateQrCodesAbsen() {
      const waliCanvas = document.getElementById('qrWaliAbsen');
      const ksCanvas = document.getElementById('qrKsAbsen');

      if (window.QRCode && waliCanvas && ksCanvas) {
        const payloadWali = `VERIFIKASI-TTE-ABSENSI-WALI-KELAS\nKelas: ${filterKelas}${filterRombel}\nSekolah: ${db.profil.namaSekolah}\nStatus: RESMI-TERVERIFIKASI`;
        QRCode.toCanvas(waliCanvas, payloadWali, { width: 64, margin: 1 });

        const payloadKs = `VERIFIKASI-TTE-ABSENSI-KEPALA-SEKOLAH\nNama: ${db.profil.kepalaSekolah}\nSekolah: ${db.profil.namaSekolah}\nStatus: RESMI-TERVERIFIKASI`;
        QRCode.toCanvas(ksCanvas, payloadKs, { width: 64, margin: 1 });
      }
    }

    // ==========================================
    // 14. BOOTSTRAP APLIKASI
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      render();
    });
  </script>
</body>
</html>
