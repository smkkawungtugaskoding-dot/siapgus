<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>SiApgus - Sistem Aplikasi Guru Sekolah</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- QRCode.js untuk TTE Resmi -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- SheetJS untuk Export XLSX -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Dynamic Favicon: Otomatis berubah saat logo sekolah tersimpan -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" id="appFavicon">
  <link rel="shortcut icon" href="favicon.ico" id="appFaviconShortcut">
  
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }

    /* Print Styles: Menghilangkan header & footer URL browser serta margin otomatis */
    @media print {
      @page {
        margin: 0;
        size: A4 portrait;
      }
      body {
        background-color: #ffffff !important;
        color: #000000 !important;
        padding: 10mm 15mm 10mm 15mm !important;
        margin: 0 !important;
      }
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      .print-card {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      table {
        page-break-inside: auto;
      }
      tr {
        page-break-inside: avoid;
        page-break-after: auto;
      }
    }
    @media screen {
      .print-only {
        display: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- ========================================== -->
  <!-- APP ROOT CONTAINER -->
  <!-- ========================================== -->
  <div id="app" class="flex-1 flex flex-col">
    <!-- Konten dinamis akan dirender oleh JavaScript -->
  </div>

  <!-- Toast Notifikasi Global -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
    <div id="toastContent" class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-slate-700">
      <span id="toastIcon">✓</span>
      <span id="toastMsg">Pesan notifikasi</span>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- SCRIPT APLIKASI UTAMA (SiApgus Engine) -->
  <!-- ========================================== -->
  <script>
    // ==========================================
    // 1. DATA AWAL (DEFAULT DATABASE)
    // ==========================================
    const DEFAULT_DATA = {
      profil: {
        namaSekolah: '',
        kepalaSekolah: '',
        nuptk: '',
        npsn: '',
        akreditasi: '',
        kurikulum: '',
        kodePos: '',
        alamatSekolah: '',
        telp: '',
        logoUrl: ''
      },
      users: [
        { id: 'USR-001', username: 'admin', password: '123', role: 'admin', fullName: 'Administrator', email: 'admin@sekolah.sch.id', nikNuptk: '' }
      ],
      siswa: [],
      guru: [],
      mapel: [],
      waliKelas: [],
      jurnal: [],
      penilaian: [],
      absensi: []
    };

    // ==========================================
    // 2. STATE MANAGER
    // ==========================================
    const STORAGE_KEY = 'siapgus_gas_db_v2';
    let db = loadDatabase();
    let currentUser = null;
    let activeTab = 'login';
    let filterKelas = '7';
    let filterRombel = 'A';
    let filterMapel = '';
    let selectedSiswaId = '';
    let raporMode = 'sisipan'; // 'sisipan' atau 'akhir'
    let showPreviewModalRapor = false;
    let isGasEnvironment = typeof google !== 'undefined' && google.script && google.script.run;
    let syncStatusText = isGasEnvironment ? 'Terkoneksi Google Spreadsheet' : 'Penyimpanan Lokal Aktif';

    function loadDatabase() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...DEFAULT_DATA, ...parsed };
        }
      } catch (e) {
        console.error('Error load localStorage:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    function saveDatabaseLocally() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      } catch (e) {
        console.error('Error save localStorage:', e);
      }
    }

    // Sinkronisasi otomatis ke Google Apps Script (jika dijalankan di Apps Script)
    function syncToGoogleSheets(silent = false) {
      saveDatabaseLocally();
      if (isGasEnvironment) {
        if (!silent) showToast('Menyinkronkan ke Google Spreadsheet...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (!silent) showToast(res.message || 'Data tersimpan ke Spreadsheet!', 'success');
            syncStatusText = 'Tersinkronisasi Spreadsheet: ' + new Date().toLocaleTimeString('id-ID');
            renderHeaderStatus();
          })
          .withFailureHandler(function(err) {
            if (!silent) showToast('Gagal sinkron: ' + err.message, 'error');
            syncStatusText = 'Gagal sinkronisasi';
            renderHeaderStatus();
          })
          .apiSaveDatabase(JSON.stringify(db));
      } else {
        if (!silent) showToast('Data berhasil disimpan secara lokal!', 'success');
      }
    }

    function pullFromGoogleSheets() {
      if (isGasEnvironment) {
        showToast('Mengambil data terbaru dari Spreadsheet...', 'info');
        google.script.run
          .withSuccessHandler(function(res) {
            if (res && res.status === 'success' && res.data) {
              db = { ...db, ...res.data };
              saveDatabaseLocally();
              showToast('Data berhasil diperbarui dari Google Spreadsheet!', 'success');
              render();
            }
          })
          .withFailureHandler(function(err) {
            showToast('Gagal mengambil data: ' + err.message, 'error');
          })
          .apiGetDatabase();
      } else {
        showToast('Berjalan di browser biasa (Standalone Mode)', 'info');
      }
    }

    // Inisialisasi awal tarik data dari GAS jika ada
    if (isGasEnvironment) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.status === 'success' && res.data && res.data.profil) {
            db = { ...db, ...res.data };
            saveDatabaseLocally();
            render();
          }
        })
        .apiGetDatabase();
    }

    // ==========================================
    // 3. TOAST NOTIFICATION HELPER
    // ==========================================
    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');
      const toastContent = document.getElementById('toastContent');

      toastMsg.innerText = msg;
      if (type === 'success') {
        toastIcon.innerHTML = '✓';
        toastContent.className = 'bg-emerald-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-emerald-500';
      } else if (type === 'error') {
        toastIcon.innerHTML = '✕';
        toastContent.className = 'bg-rose-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-rose-500';
      } else {
        toastIcon.innerHTML = 'ℹ';
        toastContent.className = 'bg-blue-600 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium border border-blue-500';
      }

      toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      }, 3000);
    }

    // Update Dynamic Favicon on Browser Tab
    function updatePageFavicon(logoUrl) {
      const defaultIcon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpolygon points='32,14 54,25 32,36 10,25' fill='%23ffffff'/%3E%3Cpath d='M19,30 L19,41 C19,41 24,46 32,46 C40,46 45,41 45,41 L45,30 Z' fill='%23ffffff' opacity='0.95'/%3E%3Cpolygon points='48,27 51,37 48,39' fill='%23fbbf24'/%3E%3C/svg%3E";
      const target = (logoUrl && logoUrl.trim().length > 0) ? logoUrl.trim() : defaultIcon;

      // Hapus favicon lama agar browser tab langsung merefresh icon secara instan
      const existingIcons = document.querySelectorAll("link[rel*='icon']");
      existingIcons.forEach(el => el.remove());

      const newIcon = document.createElement('link');
      newIcon.rel = 'icon';
      newIcon.id = 'appFavicon';
      newIcon.href = target;
      document.head.appendChild(newIcon);

      const newShortcut = document.createElement('link');
      newShortcut.rel = 'shortcut icon';
      newShortcut.id = 'appFaviconShortcut';
      newShortcut.href = target;
      document.head.appendChild(newShortcut);
    }

    function renderHeaderStatus() {
      const el = document.getElementById('cloudStatusBadge');
      if (el) el.innerText = syncStatusText;
    }

    // ==========================================
    // 4. AUTENTIKASI (LOGIN & LOGOUT)
    // ==========================================
    function login(username, password) {
      const user = db.users.find(u => u.username === username && u.password === password);
      if (user) {
        currentUser = user;
        activeTab = user.role === 'admin' ? 'dashboard' : 'guru_dashboard';
        showToast(`Selamat datang, ${user.fullName}!`, 'success');
        render();
      } else {
        showToast('Username atau password salah! (Coba admin/123 atau budi/123)', 'error');
      }
    }

    function logout() {
      currentUser = null;
      activeTab = 'login';
      showToast('Anda telah keluar dari aplikasi.', 'info');
      render();
    }

    // ==========================================
    // 5. HELPER KALKULASI NILAI KURIKULUM MERDEKA
    // ==========================================
    function calculateNilai(s1, s2, s3, sts, sas, kktp = 75) {
      const valsSisipan = [s1, s2, sts].filter(v => v !== null && v !== undefined && v !== '');
      const nilaiSisipan = valsSisipan.length > 0
        ? Math.round(valsSisipan.reduce((a, b) => Number(a) + Number(b), 0) / valsSisipan.length)
        : 0;

      const valsAkhir = [s1, s2, s3, sts, sas].filter(v => v !== null && v !== undefined && v !== '');
      const nilaiAkhir = valsAkhir.length > 0
        ? Math.round(valsAkhir.reduce((a, b) => Number(a) + Number(b), 0) / valsAkhir.length)
        : 0;

      let capaianSisipan = '';
      if (nilaiSisipan >= 90) capaianSisipan = 'Menunjukkan penguasaan sangat istimewa pada tujuan pembelajaran yang diujikan.';
      else if (nilaiSisipan >= kktp) capaianSisipan = 'Menunjukkan penguasaan yang baik dan telah mencapai kriteria ketuntasan (KKTP).';
      else capaianSisipan = 'Perlu bimbingan dan penguatan secara terstruktur pada materi pembelajaran.';

      let capaianAkhir = '';
      if (nilaiAkhir >= 90) capaianAkhir = 'Sangat baik dan konsisten dalam menganalisis serta menyelesaikan persoalan materi secara mandiri.';
      else if (nilaiAkhir >= kktp) capaianAkhir = 'Mencapai kriteria ketuntasan minimum dengan pemahaman yang baik pada seluruh capaian pembelajaran.';
      else capaianAkhir = 'Perlu pendampingan remedial dan pengulangan konsep dasar kompetensi.';

      return { nilaiSisipan, capaianSisipan, nilaiAkhir, capaianAkhir };
    }

    // ==========================================
    // 6. RENDER ENGINE
    // ==========================================
    function render() {
      const app = document.getElementById('app');

      // Sinkronkan favicon tab browser dengan logo sekolah
      if (db && db.profil) {
        updatePageFavicon(db.profil.logoUrl);
      }

      if (!currentUser) {
        app.innerHTML = renderLoginScreen();
        return;
      }

      app.innerHTML = `
        <!-- Navbar Atas (No-Print) -->
        <header class="no-print bg-white border-b border-slate-200 sticky top-0 z-30 shadow-xs">
          <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
              <!-- Brand Logo & School -->
              <div class="flex items-center gap-3">
                ${db.profil.logoUrl ? `
                  <img src="${db.profil.logoUrl}" alt="Logo Sekolah" class="w-10 h-10 object-contain rounded-xl bg-white p-0.5 border border-slate-200 shadow-xs">
                ` : `
                  <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
                    SG
                  </div>
                `}
                <div>
                  <div class="font-bold text-slate-900 text-sm leading-tight">SiApgus</div>
                  <div class="text-[11px] text-slate-500 line-clamp-1 max-w-[220px] sm:max-w-md">${db.profil.namaSekolah}</div>
                </div>
              </div>

              <!-- Status Sinkronisasi & User Profile -->
              <div class="flex items-center gap-3 sm:gap-4">
                <div class="hidden md:flex items-center gap-2 px-3 py-1 bg-blue-50 border border-blue-200 rounded-full text-xs text-blue-700">
                  <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span id="cloudStatusBadge">${syncStatusText}</span>
                </div>

                <div class="flex items-center gap-2 pl-3 border-l border-slate-200">
                  <div class="text-right hidden sm:block">
                    <div class="text-xs font-semibold text-slate-800">${currentUser.fullName}</div>
                    <div class="text-[10px] uppercase font-bold text-blue-600 tracking-wider">${currentUser.role}</div>
                  </div>
                  <button onclick="logout()" title="Keluar dari Aplikasi" class="p-2 text-slate-500 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition text-xs font-medium flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                    <span class="hidden sm:inline">Keluar</span>
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Navigation Sub-Menu Bar -->
          <div class="bg-slate-50 border-t border-slate-200 px-4 sm:px-6 lg:px-8 overflow-x-auto scrollbar-none">
            <div class="max-w-7xl mx-auto flex items-center gap-1 sm:gap-2 py-2">
              ${renderNavButtons()}
            </div>
          </div>
        </header>

        <!-- Main Workspace -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
          ${renderActiveContent()}
        </main>

        <!-- Footer (No-Print) -->
        <footer class="no-print bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
          <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>SiApgus © 2026 - ${db.profil.namaSekolah}</span>
            <span>Didukung oleh Google Apps Script & Google Spreadsheet</span>
          </div>
        </footer>
      `;

      // Jika tab aktif adalah Cetak Rapor atau Absensi, buat QR Code secara dinamis
      if (activeTab === 'cetak_rapor') {
        generateQrCodesRapor();
      } else if (activeTab === 'cetak_absen') {
        generateQrCodesAbsen();
      }
    }

    // ==========================================
    // 7. RENDER NAVIGATION BUTTONS
    // ==========================================
    function renderNavButtons() {
      if (currentUser.role === 'admin') {
        return `
          ${navBtn('dashboard', '📊 Ringkasan')}
          ${navBtn('siswa', '👥 Data Siswa')}
          ${navBtn('guru', '👨‍🏫 Data Guru')}
          ${navBtn('mapel', '📚 Mapel & Penugasan')}
          ${navBtn('wali', '🏫 Wali Kelas')}
          ${navBtn('cetak_rapor', '🖨️ Cetak Rapor')}
          ${navBtn('profil', '⚙️ Profil Sekolah')}
          ${navBtn('sync', '🔄 Sinkronisasi Spreadsheet')}
        `;
      } else {
        // Cek penugasan Wali Kelas otomatis dari Admin Menu Wali Kelas
        const isWali = db.waliKelas.some(w => 
          (w.namaGuru && currentUser.fullName && w.namaGuru.trim().toLowerCase() === currentUser.fullName.trim().toLowerCase()) ||
          (w.nikNuptk && currentUser.nikNuptk && w.nikNuptk === currentUser.nikNuptk)
        );
        return `
          ${navBtn('guru_dashboard', '📊 Beranda Guru')}
          ${navBtn('jurnal', '📖 Jurnal Harian')}
          ${navBtn('penilaian', '📝 Penilaian KKTP')}
          ${navBtn('absensi', '📅 Presensi Siswa')}
          ${isWali ? navBtn('cetak_rapor', '🖨️ Cetak Rapor Siswa') : ''}
          ${navBtn('cetak_absen', '🖨️ Cetak Presensi & TTE')}
        `;
      }
    }

    function navBtn(tabId, label) {
      const active = activeTab === tabId;
      const base = "px-3.5 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition ";
      const activeClass = "bg-blue-600 text-white shadow-xs";
      const inactiveClass = "text-slate-600 hover:text-slate-900 hover:bg-slate-200/60";
      return `<button onclick="switchTab('${tabId}')" class="${base} ${active ? activeClass : inactiveClass}">${label}</button>`;
    }

    function switchTab(tabId) {
      activeTab = tabId;
      render();
    }

    // ==========================================
    // 8. RENDER LOGIN SCREEN
    // ==========================================
    function renderLoginScreen() {
      return `
        <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
          <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <!-- Header Card -->
            <div class="bg-gradient-to-br from-blue-700 to-indigo-800 p-8 text-white text-center">
              ${db.profil.logoUrl ? `
                <div class="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-md overflow-hidden p-1.5">
                  <img src="${db.profil.logoUrl}" alt="Logo Sekolah" class="w-full h-full object-contain">
                </div>
              ` : `
                <div class="w-16 h-16 bg-white/10 backdrop-blur-xs rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/20 text-2xl font-black">
                  SG
                </div>
              `}
              <h1 class="text-2xl font-black tracking-tight">SiApgus</h1>
              <p class="text-xs text-blue-100 mt-1">Sistem Aplikasi Guru Sekolah Terpadu</p>
              <div class="mt-3 inline-block px-3 py-1 bg-white/10 rounded-full text-[11px] font-medium border border-white/10">
                Google Apps Script & Spreadsheet
              </div>
            </div>

            <!-- Login Form -->
            <div class="p-6 sm:p-8 space-y-5">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Pengguna</label>
                <input id="loginUser" type="text" value="admin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan username">
              </div>

              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Kata Sandi (Password)</label>
                <input id="loginPass" type="password" value="123" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Masukkan password">
              </div>

              <button onclick="handleLoginSubmit()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition text-sm">
                Masuk ke SiApgus
              </button>

              <!-- Quick Demo Access Buttons -->
              <div class="pt-4 border-t border-slate-100">
                <div class="text-[11px] text-center font-semibold text-slate-400 uppercase tracking-wider mb-3">Akses Cepat Pengujian</div>
                <div class="grid grid-cols-2 gap-2">
                  <button onclick="login('admin', '123')" class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg text-center transition">
                    Masuk sbg Admin
                  </button>
                  <button onclick="login('budi', '123')" class="px-3 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold rounded-lg text-center transition">
                    Masuk sbg Guru (Budi)
                  </button>
                </div>
              </div>
            </div>

            <div class="bg-slate-50 px-6 py-3 border-t border-slate-100 text-center text-[11px] text-slate-400">
              ${db.profil.namaSekolah}
            </div>
          </div>
        </div>
      `;
    }

    function handleLoginSubmit() {
      const u = document.getElementById('loginUser').value.trim();
      const p = document.getElementById('loginPass').value.trim();
      login(u, p);
    }

    // ==========================================
    // 9. ACTIVE CONTENT ROUTER
    // ==========================================
    function renderActiveContent() {
      switch (activeTab) {
        case 'dashboard': return renderAdminDashboard();
        case 'siswa': return renderDataSiswa();
        case 'guru': return renderDataGuru();
        case 'mapel': return renderDataMapel();
        case 'wali': return renderDataWaliKelas();
        case 'profil': return renderProfilSekolah();
        case 'sync': return renderSyncSpreadsheet();

        case 'guru_dashboard': return renderGuruDashboard();
        case 'jurnal': return renderJurnalGuru();
        case 'penilaian': return renderPenilaianGuru();
        case 'absensi': return renderAbsensiGuru();
        case 'cetak_rapor': {
          const isWali = db.waliKelas.some(w => 
            (w.namaGuru && currentUser.fullName && w.namaGuru.trim().toLowerCase() === currentUser.fullName.trim().toLowerCase()) ||
            (w.nikNuptk && currentUser.nikNuptk && w.nikNuptk === currentUser.nikNuptk)
          );
          if (currentUser.role !== 'admin' && !isWali) {
            return `
              <div class="bg-white rounded-2xl border border-amber-200 p-8 text-center max-w-xl mx-auto space-y-4 shadow-sm my-8">
                <div class="w-16 h-16 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-2xl font-black">
                  ⚠️
                </div>
                <div>
                  <h2 class="text-lg font-bold text-slate-800">Akses Khusus Wali Kelas yang Ditunjuk</h2>
                  <p class="text-xs text-slate-500 mt-1 leading-relaxed">
                    Menu Cetak Rapor Siswa hanya dapat diakses oleh Wali Kelas yang telah ditunjuk dan tersimpan otomatis pada Menu Wali Kelas oleh Administrator. Anda saat ini login sebagai Guru Mata Pelajaran.

    function handleLogoFileSelected(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      showToast('Mengoptimasi logo sekolah...', 'info');

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 160;
          let w = img.width;
          let h = img.height;
          if (w > h) {
            if (w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            }
          } else {
            if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);

          // Gunakan JPEG dengan kompresi 0.82 agar ukuran file kecil (~5KB)
          db.profil.logoUrl = base64;
          updatePageFavicon(base64);
          showToast('Logo berhasil dioptimasi, favicon tab diperbarui & disimpan!', 'success');
          syncToGoogleSheets();
          render();
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateAbsenStatus(siswaId, status) {
      const today = new Date().toISOString().split('T')[0];
      let rec = db.absensi.find(a => a.siswaId === siswaId && a.tanggal === today);
      const siswa = db.siswa.find(s => s.id === siswaId);
      if (rec) {
        rec.status = status;
      } else {
        db.absensi.push({
          id: 'ABS-' + Date.now() + '-' + siswaId,
          tanggal: today,
          kelas: filterKelas,
          rombel: filterRombel,
          siswaId: siswaId,
          namaSiswa: siswa ? siswa.nama : '',
          status: status,
          keterangan: '',
          waliKelas: currentUser.fullName
        });
      }
    }

    function updateAbsenKet(siswaId, ket) {
      const today = new Date().toISOString().split('T')[0];
      let rec = db.absensi.find(a => a.siswaId === siswaId && a.tanggal === today);
      if (rec) rec.keterangan = ket;
    }

    function setSemuaHadir() {
      const siswaList = db.siswa.filter(s => s.kelas === filterKelas && s.rombel === filterRombel);
      const today = new Date().toISOString().split('T')[0];
      siswaList.forEach(s => {
        let rec = db.absensi.find(a => a.siswaId === s.id && a.tanggal === today);
        if (rec) {
          rec.status = 'H';
        } else {
          db.absensi.push({
            id: 'ABS-' + Date.now() + '-' + s.id,
            tanggal: today,
            kelas: filterKelas,
            rombel: filterRombel,
            siswaId: s.id,
            namaSiswa: s.nama,
            status: 'H',
            keterangan: '',
            waliKelas: currentUser.fullName
          });
        }
      });
      syncToGoogleSheets();
      render();
    }

    function saveAllAbsenBatch() {

    function printRaporPDF() {
      const siswa = db.siswa.find(s => s.id === selectedSiswaId) || db.siswa[0];
      const origTitle = document.title;
      const safeNama = siswa ? siswa.nama.replace(/[^a-zA-Z0-9]/g, '_') : 'Siswa';
      const labelTipe = raporMode === 'sisipan' ? 'SISIPAN' : 'AKHIR_SEMESTER';
      document.title = `RAPOR_${labelTipe}_${safeNama}_KELAS_${filterKelas}${filterRombel}`;

    function downloadRaporXLSX() {
      if (typeof XLSX === 'undefined') {
        showToast('Library XLSX belum siap, gunakan Cetak PDF.', 'error');
        return;
      }
      const siswa = db.siswa.find(s => s.id === selectedSiswaId) || db.siswa[0];
      const wali = db.waliKelas.find(w => w.kodeKelas === siswa.kelas && w.rombel === siswa.rombel) || {
        namaGuru: currentUser.fullName || 'Wali Kelas',
        nikNuptk: currentUser.nikNuptk || '-'
      };
      const tglCetak = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      const judulDoc = raporMode === 'sisipan' ? 'RAPOR SISIPAN (TENGAH SEMESTER)' : 'RAPOR AKHIR SEMESTER';

      // Kumpulkan data nilai
      const rowsNilai = getGradesForStudent(siswa.id);

      const wsData = [
        [db.profil.namaSekolah.toUpperCase()],
        [`LAPORAN HASIL BELAJAR PESERTA DIDIK - ${judulDoc}`],
        [`Tahun Ajaran: 2026/2027 | Semester: Ganjil | Kurikulum: ${db.profil.kurikulum}`],
        [],
        ['IDENTITAS SISWA'],
        ['Nama Siswa', siswa.nama, '', 'Kelas / Rombel', `${siswa.kelas} - ${siswa.rombel}`],
        ['Nomor Induk / ID', siswa.id, '', 'Jenis Kelamin', siswa.jenisKelamin === 'L' ? 'Laki-laki' : 'Perempuan'],
        ['Wali Kelas', wali.namaGuru, '', 'Kepala Sekolah', db.profil.kepalaSekolah],
        [],
        [
          'No',
          'Mata Pelajaran',
          'KKTP',
          raporMode === 'sisipan' ? 'Nilai Akhir Sisipan' : 'Nilai Akhir Rapor',
          'Predikat',
          'Capaian Kompetensi Pembelajaran'
        ]
      ];

      rowsNilai.forEach((r, idx) => {
        wsData.push([
          idx + 1,
          r.mapel,
          r.kktp,
          r.nilaiUtama,
          r.predikat,
          r.capaian
        ]);
      });

      wsData.push([]);
      wsData.push(['REKAPITULASI KETIDAKHADIRAN']);
      wsData.push(['Sakit (S)', '0 Hari']);
      wsData.push(['Izin (I)', '0 Hari']);
      wsData.push(['Tanpa Keterangan (A)', '0 Hari']);
      wsData.push([]);
      wsData.push([`Surabaya, ${tglCetak}`]);
      wsData.push(['Mengetahui,', 'Wali Kelas,', 'Mengetahui,']);
      wsData.push(['Orang Tua / Wali Siswa', `Wali Kelas ${siswa.kelas}${siswa.rombel}`, `Kepala ${db.profil.namaSekolah}`]);
      wsData.push(['', '', '']);
      wsData.push(['', '', '']);
      wsData.push([
        '( ....................................... )',
        `${wali.namaGuru} (NUPTK: ${wali.nikNuptk || '-'})`,
        `${db.profil.kepalaSekolah} (NUPTK: ${db.profil.nuptk || '-'})`
      ]);

      const ws = XLSX.utils.aoa_to_sheet(wsData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, raporMode === 'sisipan' ? 'Rapor Sisipan' : 'Rapor Akhir');
      const safeNama = siswa.nama.replace(/\s+/g, '_');
      const safeTipe = raporMode === 'sisipan' ? 'SISIPAN' : 'AKHIR_SEMESTER';
      XLSX.writeFile(wb, `RAPOR_${safeTipe}_${safeNama}_KELAS_${siswa.kelas}${siswa.rombel}.xlsx`);
      showToast('File Excel Rapor berhasil diunduh!', 'success');

    function getGradesForStudent(siswaId) {
      const siswa = db.siswa.find(s => s.id === siswaId);
      const mapelList = db.mapel.length > 0 ? db.mapel.map(m => m.pelajaran) : [
        'Matematika', 'Bahasa Indonesia', 'Informatika', 'Ilmu Pengetahuan Alam (IPA)', 'Pendidikan Agama & Budi Pekerti', 'Pendidikan Pancasila'
      ];

      return mapelList.map(m => {
        const grade = db.penilaian.find(p => p.siswaId === siswaId && p.mapel.toLowerCase().includes(m.toLowerCase()));
        const kktp = grade?.kktp || 75;
        const s1 = grade?.sumatif1 ?? null;
        const s2 = grade?.sumatif2 ?? null;
        const sts = grade?.sts ?? null;
        const sas = grade?.sas ?? null;

        if (raporMode === 'sisipan') {
          let nilai = grade?.nilaiSisipan;
          if (nilai == null || nilai === '') {
            nilai = sts != null ? Math.round(((s1 || 80) + (s2 || s1 || 80) + sts) / 3) : (s1 || 82);
          }
          const pred = nilai >= 90 ? 'A (Sangat Baik)' : (nilai >= 80 ? 'B (Baik)' : (nilai >= 70 ? 'C (Cukup)' : 'D (Perlu Bimbingan)'));
          const predKode = nilai >= 90 ? 'A' : (nilai >= 80 ? 'B' : (nilai >= 70 ? 'C' : 'D'));
          const capaian = grade?.capaianSisipan || (nilai >= 80 
            ? `Menunjukkan penguasaan kompetensi yang sangat baik dan tuntas pada materi tengah semester mata pelajaran ${m}.`
            : `Menunjukkan ketuntasan yang cukup pada materi tengah semester mata pelajaran ${m}, perlu penguatan berkala.`);
          return { mapel: m, kktp, s1, s2, sts, nilaiUtama: nilai, predikat: pred, predKode, capaian };
        } else {
          let nilai = grade?.nilaiAkhir;
          if (nilai == null || nilai === '') {
            nilai = sas != null ? Math.round(((s1 || 80) + (sts || 80) + sas) / 3) : (grade?.nilaiSisipan || 83);
          }
          const pred = nilai >= 90 ? 'A (Sangat Baik)' : (nilai >= 80 ? 'B (Baik)' : (nilai >= 70 ? 'C (Cukup)' : 'D (Perlu Bimbingan)'));
          const predKode = nilai >= 90 ? 'A' : (nilai >= 80 ? 'B' : (nilai >= 70 ? 'C' : 'D'));
          const capaian = grade?.capaianAkhir || (nilai >= 80
            ? `Sangat menguasai seluruh capaian tujuan pembelajaran akhir semester pada mata pelajaran ${m} dengan hasil optimal.`
            : `Mencapai standar kriteria ketuntasan minimal pada mata pelajaran ${m} dengan pemahaman materi yang baik.`);
          return { mapel: m, kktp, s1, s2, sts, sas, nilaiUtama: nilai, predikat: pred, predKode, capaian };
        }
      });
    }
